<div
  class="app-shell"
  [class.app-shell--collapsed]="collapsed()"
  [class.app-shell--menu-open]="menuOpen()"
  [class.app-shell--anonymous]="!showChrome()"
>
  @if (showChrome()) {
    <!-- Narrow viewports only (app.scss): dims the page behind the open drawer and closes it on tap. -->
    <div class="app-sidebar-backdrop" (click)="closeMenu()"></div>

    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <span class="app-sidebar__brand-text">{{ brand }}</span>
        <button
          type="button"
          class="app-sidebar__toggle"
          [attr.aria-label]="collapsed() ? '展開選單' : '收合選單'"
          (click)="toggleSidebar()"
        >
          <i class="pi" [class.pi-angle-left]="!collapsed()" [class.pi-angle-right]="collapsed()"></i>
        </button>
      </div>

      <nav class="app-sidebar__nav">
        @for (group of navGroups(); track group.label) {
          <div class="app-nav-group">
            <button type="button" class="app-nav-group__header" (click)="toggleGroup(group)">
              <i class="app-nav-group__icon" [class]="group.icon"></i>
              <span class="app-nav-group__label">{{ group.label }}</span>
              <i
                class="app-nav-group__chevron pi"
                [class.pi-angle-down]="isExpanded(group)"
                [class.pi-angle-right]="!isExpanded(group)"
              ></i>
            </button>

            @if (isExpanded(group)) {
              <ul class="app-nav-group__items">
                @for (item of group.items; track item.route) {
                  <li>
                    <a
                      class="app-nav-item"
                      [routerLink]="item.route"
                      routerLinkActive="app-nav-item--active"
                      (click)="closeMenu()"
                    >
                      <i class="app-nav-item__icon" [class]="item.icon"></i>
                      <span class="app-nav-item__label">{{ item.label }}</span>
                    </a>
                  </li>
                }
              </ul>
            }
          </div>
        }
      </nav>
    </aside>
  }

  <main class="app-content">
    @if (showChrome()) {
      <header class="app-topbar">
        <!-- Shown only below 64rem, where the sidebar is off-canvas and needs a way in. -->
        <button type="button" class="app-topbar__menu" aria-label="開啟選單" (click)="openMenu()">
          <i class="pi pi-bars"></i>
        </button>

        <button
          type="button"
          class="app-topbar__user"
          aria-haspopup="true"
          [attr.aria-label]="'使用者選單：' + userName()"
          (click)="userMenu.toggle($event)"
        >
          <i class="pi pi-user"></i>
          <span class="app-topbar__user-name">{{ userName() }}</span>
          <i class="pi pi-angle-down app-topbar__user-caret"></i>
        </button>

        <p-menu #userMenu [model]="userMenuItems" [popup]="true" styleClass="app-user-menu" />
      </header>
    }

    <router-outlet />
  </main>
</div>

<p-toast position="top-right" />
<p-confirmDialog />
