<div class="force-password">
  <form class="force-password__card page-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="force-password__title">變更密碼</h1>
    <p class="force-password__subtitle">
      您目前使用的是預設密碼，請先設定新密碼後才能繼續使用系統。
    </p>

    <div class="form-field">
      <label for="currentPassword">目前密碼 <span class="required">*</span></label>
      <input
        id="currentPassword"
        pInputText
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        placeholder="請輸入目前密碼"
      />
      @if (isInvalid('currentPassword')) {
        <div class="field-error">目前密碼為必填。</div>
      }
    </div>

    <div class="form-field">
      <label for="newPassword">新密碼 <span class="required">*</span></label>
      <input
        id="newPassword"
        pInputText
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        placeholder="請輸入新密碼"
      />
      @if (isInvalid('newPassword')) {
        <div class="field-error">新密碼為必填。</div>
      }
    </div>

    <div class="form-field">
      <label for="confirmPassword">確認新密碼 <span class="required">*</span></label>
      <input
        id="confirmPassword"
        pInputText
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="請再次輸入新密碼"
      />
      @if (isInvalid('confirmPassword')) {
        <div class="field-error">確認新密碼為必填。</div>
      } @else if (passwordsMismatch) {
        <div class="field-error" data-field="mismatch">兩次輸入的新密碼不一致。</div>
      }
    </div>

    @if (errorMessage(); as message) {
      <div class="force-password__error" role="alert" data-field="password-error">{{ message }}</div>
    }

    <p-button
      label="變更密碼"
      icon="pi pi-key"
      severity="success"
      type="submit"
      styleClass="w-full"
      [loading]="submitting()"
    />

    <p-button
      label="登出"
      icon="pi pi-sign-out"
      severity="secondary"
      type="button"
      styleClass="w-full force-password__logout"
      (onClick)="logout()"
    />
  </form>
</div>
