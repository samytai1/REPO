<form class="featured-promo-item-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="featured-promo-item-form__title">
    {{ isEditMode() ? '編輯' : '新增' }}　{{ scheduleOn() }}　版位 {{ slot() }}
  </div>

  <div class="form-field">
    <label for="promotion">促銷代碼 PromoCode <span class="required">*</span></label>
    <p-autocomplete
      inputId="promotion"
      formControlName="promotion"
      [suggestions]="suggestions()"
      (completeMethod)="search($event)"
      (onSelect)="onPromotionSelected($event)"
      optionLabel="promoCode"
      [forceSelection]="true"
      [dropdown]="true"
      [minLength]="1"
      placeholder="輸入促銷代碼開頭後選取"
      appendTo="body"
      styleClass="w-full"
      inputStyleClass="w-full"
    />
    @if (isInvalid('promotion')) {
      <div class="field-error">請從清單選取促銷代碼。</div>
    }
  </div>

  <div class="form-field">
    <label for="topic">主題 Topic <span class="required">*</span></label>
    <input id="topic" pInputText type="text" formControlName="topic" maxlength="100" />
    @if (isInvalid('topic')) {
      <div class="field-error">主題為必填，且不可超過 100 字。</div>
    }
  </div>

  <div class="form-field">
    <label for="description">說明 Description <span class="required">*</span></label>
    <input id="description" pInputText type="text" formControlName="description" maxlength="300" />
    @if (isInvalid('description')) {
      <div class="field-error">說明為必填，且不可超過 300 字。</div>
    }
  </div>

  <div class="featured-promo-item-form__actions">
    <p-button
      label="取消"
      icon="pi pi-times"
      severity="secondary"
      type="button"
      size="small"
      (onClick)="cancel()"
    />
    <p-button
      label="儲存"
      icon="pi pi-check"
      severity="success"
      type="submit"
      size="small"
      [loading]="saving()"
    />
  </div>
</form>
