<div class="page-header page-card">
  <h1 class="page-header__title">角色 AppRole</h1>
  <span class="page-header__subtitle">使用者角色</span>

  <div class="page-header__actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? '1' : undefined"
      (onClick)="openDrawer()"
    />
    <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
  </div>
</div>

<div class="page-card app-role-list__table">
  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="roleId"
    (onLazyLoad)="onStateChange($event)"
    (onPage)="onStateChange($event)"
    (onSort)="onStateChange($event)"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" style="width: 9rem">
          權限等級 <p-sortIcon field="permissionLevel" />
        </th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" style="width: 8rem">
          使用者數 <p-sortIcon field="userCount" />
        </th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td class="app-role-list__numeric">{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td class="app-role-list__numeric">{{ role.userCount }}</td>
        <td>
          <div class="app-role-list__actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              pTooltip="檢視"
              ariaLabel="檢視"
              (onClick)="view(role)"
            />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              pTooltip="編輯"
              ariaLabel="編輯"
              (onClick)="edit(role)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              pTooltip="刪除"
              ariaLabel="刪除"
              (onClick)="confirmDelete(role)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty-text">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [(visible)]="drawerVisible"
  header="搜尋條件"
  position="right"
  styleClass="app-role-list__drawer"
>
  <div class="form-field">
    <label for="filter-keyword">關鍵字</label>
    <input
      id="filter-keyword"
      pInputText
      type="text"
      placeholder="角色代碼／角色名稱／描述"
      [(ngModel)]="draftFilters.keyword"
      (keyup.enter)="applyFilters()"
    />
  </div>

  <div class="form-field">
    <label for="filter-level-from">權限等級（起）</label>
    <p-inputnumber
      inputId="filter-level-from"
      [(ngModel)]="draftFilters.permissionLevelFrom"
      [min]="0"
      [showButtons]="false"
      styleClass="w-full"
    />
  </div>

  <div class="form-field">
    <label for="filter-level-to">權限等級（迄）</label>
    <p-inputnumber
      inputId="filter-level-to"
      [(ngModel)]="draftFilters.permissionLevelTo"
      [min]="0"
      [showButtons]="false"
      styleClass="w-full"
    />
  </div>

  <div class="app-role-list__drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="resetFilters()" />
    <p-button label="套用" icon="pi pi-check" severity="success" (onClick)="applyFilters()" />
  </div>
</p-drawer>
