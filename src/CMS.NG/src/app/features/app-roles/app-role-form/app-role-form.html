<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header page-card">
    <h1 class="page-header__title">{{ isEditMode ? '編輯角色' : '新增角色' }}</h1>

    <div class="page-header__actions">
      <p-button
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        type="button"
        (onClick)="cancel()"
      />
      <p-button
        label="儲存"
        icon="pi pi-check"
        severity="success"
        type="submit"
        [loading]="saving()"
      />
    </div>
  </div>

  <div class="page-card app-role-form__section">
    <h2 class="form-section__title">角色資料</h2>

    <div class="form-field">
      <label for="roleId">角色代碼 <span class="required">*</span></label>
      <input
        id="roleId"
        pInputText
        type="text"
        formControlName="roleId"
        placeholder="請輸入角色代碼"
        maxlength="200"
      />
      @if (isInvalid('roleId')) {
        <div class="field-error">角色代碼為必填。</div>
      }
    </div>

    <div class="form-field">
      <label for="roleName">角色名稱 <span class="required">*</span></label>
      <input id="roleName" pInputText type="text" formControlName="roleName" maxlength="200" />
      @if (isInvalid('roleName')) {
        <div class="field-error">角色名稱為必填。</div>
      }
    </div>

    <div class="form-field">
      <label for="permissionLevel">權限等級 <span class="required">*</span></label>
      <p-inputnumber
        inputId="permissionLevel"
        formControlName="permissionLevel"
        [min]="0"
        [showButtons]="false"
        styleClass="w-full"
      />
      @if (isInvalid('permissionLevel')) {
        <div class="field-error">請輸入 0 以上的權限等級。</div>
      }
    </div>

    <div class="form-field">
      <label for="description">描述</label>
      <input id="description" pInputText type="text" formControlName="description" maxlength="400" />
      @if (isInvalid('description')) {
        <div class="field-error">描述長度不可超過 400 字。</div>
      }
    </div>
  </div>

  <div class="page-card app-role-form__section">
    <h2 class="form-section__title">使用者</h2>

    <div class="form-field wrap-chips">
      <p-multiselect
        inputId="userIds"
        formControlName="userIds"
        [options]="userOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇使用者（可複選）"
        appendTo="body"
        [filter]="true"
        [maxSelectedLabels]="9999"
        [virtualScroll]="users().length >= 100"
        [virtualScrollItemSize]="43"
        styleClass="w-full"
      />
    </div>
  </div>
</form>
