<div class="page-header page-card">
  <h1 class="page-header__title">合作夥伴 Partner</h1>
  <span class="page-header__subtitle">課程的供應商／品牌</span>

  <div class="page-header__actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? '1' : undefined"
      (onClick)="openDrawer()"
    />
    <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
  </div>
</div>

<div class="page-card partner-list__table">
  <p-table
    [value]="partners()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    (onLazyLoad)="onStateChange($event)"
    (onPage)="onStateChange($event)"
    (onSort)="onStateChange($event)"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 7rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name">名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey" style="width: 9rem">
          應用代碼 <p-sortIcon field="appKey" />
        </th>
        <th pSortableColumn="nameOnPartnerMenu">
          選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" />
        </th>
        <th pSortableColumn="nameOnCourseDetailPage">
          課程明細頁名稱 <p-sortIcon field="nameOnCourseDetailPage" />
        </th>
        <th pSortableColumn="displayOrder" style="width: 8rem">
          顯示順序 <p-sortIcon field="displayOrder" />
        </th>
        <th pSortableColumn="imageFilename">圖片檔名 <p-sortIcon field="imageFilename" /></th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-partner>
      <tr>
        <td class="partner-list__numeric">{{ partner.pkid }}</td>
        <td>{{ partner.name }}</td>
        <td>{{ partner.appKey }}</td>
        <td>{{ partner.nameOnPartnerMenu }}</td>
        <td>{{ partner.nameOnCourseDetailPage }}</td>
        <td class="partner-list__numeric">{{ partner.displayOrder }}</td>
        <td>
          @if (partner.imageFilename) {
            {{ partner.imageFilename }}
          } @else {
            <span class="empty-text">—</span>
          }
        </td>
        <td>
          <div class="partner-list__actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              pTooltip="檢視"
              ariaLabel="檢視"
              (onClick)="view(partner)"
            />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              pTooltip="編輯"
              ariaLabel="編輯"
              (onClick)="edit(partner)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              pTooltip="刪除"
              ariaLabel="刪除"
              (onClick)="confirmDelete(partner)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="8" class="empty-text">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [(visible)]="drawerVisible"
  header="搜尋條件"
  position="right"
  styleClass="partner-list__drawer"
>
  <div class="form-field">
    <label for="filter-keyword">關鍵字</label>
    <input
      id="filter-keyword"
      pInputText
      type="text"
      placeholder="名稱／應用代碼／顯示名稱"
      [(ngModel)]="draftFilters.keyword"
      (keyup.enter)="applyFilters()"
    />
  </div>

  <div class="form-field">
    <label for="filter-display-order-from">顯示順序（起）</label>
    <p-inputnumber
      inputId="filter-display-order-from"
      [(ngModel)]="draftFilters.displayOrderFrom"
      [min]="0"
      [showButtons]="false"
      styleClass="w-full"
    />
  </div>

  <div class="form-field">
    <label for="filter-display-order-to">顯示順序（迄）</label>
    <p-inputnumber
      inputId="filter-display-order-to"
      [(ngModel)]="draftFilters.displayOrderTo"
      [min]="0"
      [showButtons]="false"
      styleClass="w-full"
    />
  </div>

  <div class="form-field">
    <label for="filter-has-image">圖片</label>
    <p-select
      inputId="filter-has-image"
      [(ngModel)]="draftFilters.hasImage"
      [options]="imageOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full"
    />
  </div>

  <div class="partner-list__drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="resetFilters()" />
    <p-button label="套用" icon="pi pi-check" severity="success" (onClick)="applyFilters()" />
  </div>
</p-drawer>
